name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Flutter ${{ matrix.flutter-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter-version: ["3.38.1", "3.44.7"]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib test example/lib example/test tool
      - name: Analyze
        run: >-
          flutter analyze --no-pub --fatal-infos
          lib test example/lib example/test tool
      - name: Test package with coverage
        run: flutter test --no-pub --coverage
      - name: Enforce 90% coverage
        run: dart run tool/check_coverage.dart coverage/lcov.info 90
      - name: Test example
        working-directory: example
        run: flutter test --no-pub
      - name: Validate package archive
        run: dart pub publish --dry-run

  android:
    name: Android example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true
      - working-directory: example
        run: flutter pub get
      - working-directory: example
        run: flutter build apk --debug

  ios:
    name: iOS example
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true
      - working-directory: example
        run: flutter pub get
      - working-directory: example
        run: flutter build ios --debug --no-codesign
